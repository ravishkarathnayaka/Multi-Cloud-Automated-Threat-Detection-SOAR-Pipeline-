title: AWS CloudTrail Logging Tampering or Disabled
id: f4b19c8d-e083-4a67-b50a-3c58b975e11d
status: production
description: Detects attempts to impair defenses by stopping CloudTrail logging, deleting trails, or updating trails to exclude sensitive multi-region events.
references:
    - https://attack.mitre.org/techniques/T1562/001/
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html
author: SOAR Pipeline Engineering Team
date: 2026/09/01
modified: 2026/09/01
tags:
    - attack.defense_evasion
    - attack.t1562.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: cloudtrail.amazonaws.com
        eventName:
            - StopLogging
            - DeleteTrail
            - UpdateTrail
    filter_legitimate_maintenance:
        # Exclude specific authorized break-glass or maintenance roles if applicable
        userIdentity.sessionContext.sessionIssuer.userName:
            - 'OrganizationRootAdmin'
    condition: selection and not filter_legitimate_maintenance
falsepositives:
    - Centralized infrastructure migration or trail consolidation executed by verified DevOps orchestration roles.
level: critical
