title: AWS EC2 Security Group Open Ingress or C2 Network Beaconing
id: 5a89e13b-871d-440a-9d62-11cf9c9e88b2
status: production
description: Detects opening of security group ingress rules to the public internet (0.0.0.0/0) on sensitive administrative ports or unusual outbound C2 traffic indications.
references:
    - https://attack.mitre.org/techniques/T1071/
    - https://attack.mitre.org/techniques/T1190/
    - https://attack.mitre.org/techniques/T1562/001/
author: SOAR Pipeline Engineering Team
date: 2026/09/01
modified: 2026/09/01
tags:
    - attack.initial_access
    - attack.command_and_control
    - attack.t1071
    - attack.t1190
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_sg_ingress:
        eventSource: ec2.amazonaws.com
        eventName:
            - AuthorizeSecurityGroupIngress
        requestParameters.ipPermissions.items.ipRanges.items.cidrIp:
            - '0.0.0.0/0'
            - '::/0'
        requestParameters.ipPermissions.items.toPort:
            - 22
            - 3389
            - 5432
            - 3306
            - 27017
    condition: selection_sg_ingress
falsepositives:
    - Intentional bastion host exposure or temporary developer sandbox rules (should still trigger review).
level: high
