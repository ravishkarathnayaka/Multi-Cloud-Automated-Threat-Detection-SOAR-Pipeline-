title: AWS S3 Bucket Public Exposure or Block Removal
id: 3c7a1024-bc6d-4952-b8ec-685b8813fa21
status: production
description: Detects removal of S3 Block Public Access settings or modification of bucket policies/ACLs granting public read/write permissions.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://attack.mitre.org/techniques/T1562/001/
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
author: SOAR Pipeline Engineering Team
date: 2026/09/01
modified: 2026/09/01
tags:
    - attack.exfiltration
    - attack.defense_evasion
    - attack.t1530
    - attack.t1562.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_pab:
        eventSource: s3.amazonaws.com
        eventName:
            - DeletePublicAccessBlock
    selection_policy:
        eventSource: s3.amazonaws.com
        eventName:
            - PutBucketPolicy
            - PutBucketAcl
        requestParameters.PublicAccessBlockConfiguration.BlockPublicAcls: false
    condition: selection_pab or selection_policy
falsepositives:
    - Intentional hosting of static web assets or public distributions in explicitly designated public buckets.
level: high
