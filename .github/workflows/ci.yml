name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Python Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Black Formatter Check
        run: |
          black --check --line-length 120 soar_engine tests simulations

      - name: Run Flake8 Linter
        run: |
          flake8 soar_engine tests simulations

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r soar_engine/requirements.txt

      - name: Run Unit Tests with Coverage
        run: |
          pytest tests/ -v --cov=soar_engine --cov-report=term --cov-report=xml

      - name: Run Playbook Integration Tests
        run: |
          python simulations/test_playbooks.py

  terraform:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check

      - name: Terraform Init
        run: |
          terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: |
          terraform -chdir=terraform validate
